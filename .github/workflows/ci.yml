name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Boot manager tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Verify lean repository boundary
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(.github|dependencies|extras|scripts)(/|$)|^docs/bubble-tea-migration-scope.md$|^(.gitignore|LICENSE|NOTICE|README.md|SECURITY.md)$'
          unexpected="$(git ls-files | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Unexpected files outside the Arkey v3 boot-manager boundary:' >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Check shell syntax
        run: |
          bash -n \
            extras/codex-boot/arkey \
            extras/codex-boot/arkey-boot-lib \
            extras/codex-boot/arkey-boot-menu \
            extras/codex-boot/arkey-hardware-scan \
            extras/codex-boot/arkey-local-runtime \
            extras/codex-boot/codex-moonbridge \
            extras/codex-boot/install.sh \
            extras/codex-boot/test.sh \
            scripts/install-moonbridge-dependency.sh

      - name: Run Arkey boot tests
        run: extras/codex-boot/test.sh

      - name: Validate pinned MoonBridge revision
        shell: bash
        run: |
          set -euo pipefail
          source dependencies/moonbridge.env
          [[ "$MOONBRIDGE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          dependency_check="$(mktemp -d)"
          git -C "$dependency_check" init --quiet
          git -C "$dependency_check" fetch --quiet --depth 1 "$MOONBRIDGE_REPOSITORY" "$MOONBRIDGE_REVISION"
          test "$(git -C "$dependency_check" rev-parse FETCH_HEAD)" = "$MOONBRIDGE_REVISION"
